version: "3.9"

# -----------------------------------------------------------------------------
# PixelGuard local / staging stack.
#   - MongoDB        :27017
#   - FastAPI backend:8000
#   - React frontend :3000
# Production deployment notes live in docs/DEPLOYMENT.md.
# -----------------------------------------------------------------------------

services:
  mongo:
    image: mongo:7
    container_name: pixelguard-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: pixelguard
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: pixelguard-backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB: pixelguard
      DEBUG: "True"
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-change-me}
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
      UPLOAD_DIR: /app/uploads
      MODEL_PATH: /app/models
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./models:/app/models
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status == 200 else sys.exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: pixelguard-frontend
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Optional reverse proxy — enable with `--profile production`.
  nginx:
    image: nginx:alpine
    container_name: pixelguard-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    profiles:
      - production

volumes:
  mongo_data:

networks:
  default:
    name: pixelguard-network
